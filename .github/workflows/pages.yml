name: Deploy Connect 4 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp -r static engine _site/
          python3 -c "
          with open('templates/index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          with open('static/css/style.css', 'r', encoding='utf-8') as f:
              css = f.read()
          link_tag = '<link rel=\"stylesheet\" href=\"{{ url_for(\'static\', filename=\'css/style.css\') }}\" />'
          assert link_tag in html, 'Stylesheet link tag not found in templates/index.html'
          html = html.replace(link_tag, f'<style>\n{css}\n</style>')
          html = html.replace(\"{{ url_for('static', filename='js/game.js') }}\", 'static/js/game.js')
          with open('_site/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          "
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
